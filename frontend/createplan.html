<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Study Plan Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    *{box-sizing:border-box} body{font-family:Inter,sans-serif; background:#f7f8ff; margin:0; padding:40px 20px;}
    .card{max-width:700px; margin:auto; background:white; padding:40px; border-radius:24px; box-shadow:0 15px 35px rgba(0,0,0,0.08);}
    .step{display:none;} .active{display:block;}
    .progress-bar{height:8px; background:#eee; border-radius:10px; margin-bottom:30px; overflow:hidden;}
    .progress{height:100%; width:20%; background:#512da8; transition:0.3s;}
    h2{color:#512da8;} input, textarea{width:100%; padding:14px; border-radius:12px; border:1px solid #ddd; margin:10px 0 20px;}
    .options{display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-bottom:20px;}
    .option{padding:12px; border:1px solid #ddd; border-radius:10px; text-align:center; cursor:pointer; font-weight:500;}
    .option.active{background:#512da8; color:white; border-color:#512da8;}
    .actions{display:flex; justify-content:space-between; margin-top:20px;}
    .next{background:#512da8; color:white; border:none; padding:12px 30px; border-radius:10px; cursor:pointer;}
    .back{background:none; border:none; color:#777; cursor:pointer;}
</style>
</head>
<body>

<div class="card">
    <div class="progress-bar"><div class="progress" id="progress"></div></div>

    <div class="step active">
        <h2>Target Goal</h2>
        <label>Role</label><input id="targetRole" placeholder="e.g. Data Scientist">
        <label>Company</label><input id="targetCompany" placeholder="e.g. Amazon">
        <div class="actions"><span></span><button class="next">Next</button></div>
    </div>

    <div class="step">
        <h2>Time Commitment</h2>
        <label>Timeline</label>
        <div class="options" data-field="timeline">
            <div class="option">1 Month</div><div class="option active">3 Months</div><div class="option">6 Months</div>
        </div>
        <label>Hours Daily</label>
        <div class="options" data-field="dailyHours">
            <div class="option">1-2 hrs</div><div class="option active">3-4 hrs</div><div class="option">5+ hrs</div>
        </div>
        <div class="actions"><button class="back">Back</button><button class="next">Next</button></div>
    </div>

    <div class="step">
        <h2>Final Details</h2>
        <label>Biggest Challenge</label>
        <textarea id="challenges" placeholder="e.g. Coding interviews, Consistency"></textarea>
        <label>Plan Format</label>
        <div class="options" data-field="planFormat">
            <div class="option">Daily</div><div class="option active">Weekly</div><div class="option">Monthly</div>
        </div>
        <div class="actions"><button class="back">Back</button><button class="next" id="genBtn">Generate Plan</button></div>
    </div>
</div>

<script>
    const API_BASE_URL = "https://resume-analyser-project.onrender.com";
    let currentStep = 0;
    const steps = document.querySelectorAll('.step');
    const progress = document.getElementById('progress');

    document.querySelectorAll('.option').forEach(opt => {
        opt.onclick = () => {
            opt.parentElement.querySelectorAll('.option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
        };
    });

    document.querySelectorAll('.next').forEach(btn => {
        btn.onclick = async () => {
            if (currentStep < steps.length - 1) {
                steps[currentStep].classList.remove('active');
                currentStep++;
                steps[currentStep].classList.add('active');
                progress.style.width = ((currentStep + 1) / steps.length) * 100 + "%";
            } else {
                btn.innerText = "Generating...";
                btn.disabled = true;
                const payload = {
                    resumeAnalysis: sessionStorage.getItem("lastAnalysis") || "No previous gaps identified.",
                    targetRole: document.getElementById('targetRole').value,
                    targetCompany: document.getElementById('targetCompany').value,
                    timeline: document.querySelector('[data-field="timeline"] .active').innerText,
                    dailyHours: document.querySelector('[data-field="dailyHours"] .active').innerText,
                    learningStyle: "Visual/Practical",
                    planFormat: document.querySelector('[data-field="planFormat"] .active').innerText,
                    challenges: document.getElementById('challenges').value
                };

                try {
                    const res = await fetch(`${API_BASE_URL}/study-plan`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    sessionStorage.setItem("studyPlanData", data.study_plan);
                    window.location.href = "study-plan-result.html";
                } catch (e) { alert("Error connecting to server."); btn.disabled = false; btn.innerText = "Generate Plan"; }
            }
        };
    });

    document.querySelectorAll('.back').forEach(btn => {
        btn.onclick = () => {
            steps[currentStep].classList.remove('active');
            currentStep--;
            steps[currentStep].classList.add('active');
            progress.style.width = ((currentStep + 1) / steps.length) * 100 + "%";
        };
    });
</script>
</body>
</html>
