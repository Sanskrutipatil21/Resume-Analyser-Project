<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Study Plan Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,#eef0ff,#f7f8ff);color:#222;}
nav{background:linear-gradient(90deg,#5c6bc0,#512da8);padding:20px 40px;color:white;border-radius:0 0 20px 20px;}
.wrapper{max-width:900px;margin:50px auto 80px;padding:0 20px;}
.header{text-align:center;margin-bottom:40px;}
.header h1{font-size:2.6rem;color:#512da8;}
.header p{color:#555;max-width:600px;margin:auto;}
.card{background:rgba(255,255,255,0.55);backdrop-filter:blur(18px);border-radius:28px;padding:45px;box-shadow:0 25px 50px rgba(0,0,0,0.12);} 
.progress-bar{height:10px;background:#e0e0e0;border-radius:99px;overflow:hidden;margin-bottom:35px;}
.progress{height:100%;width:20%;background:linear-gradient(90deg,#5c6bc0,#512da8);transition:0.4s;} 
.step{display:none;animation:fade 0.4s ease}
.step.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.step h2{color:#512da8;margin-bottom:8px;} 
.step p{color:#555;margin-bottom:25px;}
.field{margin-bottom:30px}
label{font-weight:600;margin-bottom:10px;display:block}
input,textarea{width:100%;padding:16px;border-radius:14px;border:1px solid rgba(0,0,0,0.15);font-size:1rem;}
textarea{resize:none;min-height:90px;}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
.option{padding:16px;text-align:center;border-radius:16px;background:rgba(255,255,255,0.7);cursor:pointer;font-weight:500;border:1px solid rgba(0,0,0,0.1);transition:0.25s;}
.option:hover{transform:translateY(-3px)}
.option.active{background:linear-gradient(135deg,#5c6bc0,#512da8);color:white;} 
.actions{display:flex;justify-content:space-between;margin-top:35px;}
button{padding:14px 32px;border:none;border-radius:16px;font-weight:600;cursor:pointer;}
.next{background:linear-gradient(135deg,#5c6bc0,#512da8);color:white;} 
.back{background:transparent;border:1px solid #aaa;}
</style>
</head>

<body>

<div class="wrapper">
  <div class="header">
    <h1>Build Your AI Study Plan</h1>
    <p>Answer a few smart questions and get a roadmap designed just for you</p>
  </div>

  <div class="card">
    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <!-- steps unchanged (UI only) -->
    <!-- ... UI CONTENT SAME AS YOUR FILE ... -->

  </div>
</div>

<script>
/* ================= FIX STARTS HERE ================= */

// ✅ PRODUCTION BACKEND URL
const API_BASE_URL = "https://resume-analyser-project.onrender.com";

const steps = document.querySelectorAll('.step');
const progress = document.getElementById('progress');
let current = 0;

let resumeAnalysis = '';
const urlParams = new URLSearchParams(window.location.search);
const docId = urlParams.get('id');

// ✅ FIXED: resume analysis fetch
if(docId){
  fetch(`${API_BASE_URL}/resume-analysis?id=${docId}`)
    .then(res => res.json())
    .then(data => {
      resumeAnalysis = data.analysis || '';
      console.log("Resume analysis loaded");
    })
    .catch(err => console.error("Resume analysis fetch failed", err));
}

function collectUserInfo(){
  return {
    resumeAnalysis,
    targetRole: document.getElementById('targetRole').value,
    targetCompany: document.getElementById('targetCompany').value,
    timeline: document.querySelector('[data-field="timeline"] .option.active')?.textContent || '',
    dailyHours: document.querySelector('[data-field="dailyHours"] .option.active')?.textContent || '',
    skillLevel: document.querySelectorAll('.step[data-step="3"] .option.active')[0]?.textContent || '',
    skillsToImprove: document.querySelector('.step[data-step="3"] textarea')?.value || '',
    learningStyle: document.querySelectorAll('.step[data-step="4"] .option.active')[0]?.textContent || '',
    studyPreference: document.querySelectorAll('.step[data-step="4"] .option.active')[1]?.textContent || '',
    biggestChallenge: document.querySelector('.step[data-step="5"] textarea')?.value || '',
    planFormat: document.querySelectorAll('.step[data-step="5"] .option.active')[0]?.textContent || ''
  };
}

// ✅ FIXED: study plan API call
async function sendToBackend(userInfo){
  try{
    const res = await fetch(`${API_BASE_URL}/study-plan`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(userInfo)
    });

    const data = await res.json();

    if(data.study_plan){
      sessionStorage.setItem('studyPlanData', data.study_plan);
      window.location.href = 'study-plan-result.html';
    } else {
      alert('Could not generate plan.');
    }
  } catch(err){
    alert('Backend error. Try again.');
    console.error(err);
  }
}

document.querySelector('.step:last-child .next').onclick = async ()=>{
  const userInfo = collectUserInfo();
  await sendToBackend(userInfo);
};

/* ================= FIX ENDS HERE ================= */
</script>

<script type="module" src="auth.js"></script>
<script type="module" src="profile.js"></script>
</body>
</html>
