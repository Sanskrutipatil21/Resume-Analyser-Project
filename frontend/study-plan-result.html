<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Study Roadmap</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body{font-family:'Inter',sans-serif; background:#f7f8ff; padding:50px 20px;}
        .container{max-width:850px; margin:auto; background:white; padding:40px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05);}
        h1{color:#512da8; border-bottom:2px solid #eee; padding-bottom:15px;}
        #content h2{color:#5c6bc0; margin-top:30px;}
        .btns{margin-top:40px; display:flex; gap:15px;}
        .btn{padding:12px 25px; border-radius:10px; border:none; cursor:pointer; font-weight:600;}
        .print{background:#512da8; color:white;}
        @media print{ .btns{display:none;} }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Personalized Roadmap</h1>
        <div id="content">Loading...</div>
        <div class="btns">
            <button onclick="window.print()" class="btn print">Download as PDF</button>
            <button onclick="location.href='createplan.html'" class="btn">Start Over</button>
        </div>
    </div>
    <script>
        const data = sessionStorage.getItem("studyPlanData");
        if(data) document.getElementById('content').innerHTML = marked.parse(data);
        else document.getElementById('content').innerHTML = "No plan found. Please go back.";
    </script>
</body>
</html>
