<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Personalized Study Plan</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #512da8;
            --secondary: #5c6bc0;
            --bg: #f7f8ff;
            --text: #333;
        }

        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            line-height: 1.6;
        }

        .container { 
            max-width: 900px; 
            margin: 50px auto; 
            padding: 40px; 
            background: white; 
            border-radius: 24px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
        }

        .header { 
            text-align: center; 
            margin-bottom: 40px; 
            border-bottom: 2px solid #eee; 
            padding-bottom: 20px; 
        }

        .header h1 { color: var(--primary); font-size: 2.2rem; margin: 0; }
        .header p { color: #666; margin-top: 10px; }

        /* Markdown Content Styling */
        #planContent h1, #planContent h2 { color: var(--secondary); margin-top: 30px; }
        #planContent h3 { color: #444; margin-top: 20px; }
        #planContent ul, #planContent ol { padding-left: 25px; margin-bottom: 20px; }
        #planContent li { margin-bottom: 12px; }
        #planContent blockquote { 
            border-left: 5px solid var(--secondary); 
            padding: 10px 20px; 
            background: #f0f2ff; 
            margin: 20px 0; 
            font-style: italic; 
        }
        #planContent code { 
            background: #eee; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-family: monospace; 
        }

        .actions { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 50px; 
            padding-top: 30px; 
            border-top: 1px solid #eee; 
        }

        .btn { 
            padding: 14px 28px; 
            border-radius: 12px; 
            font-weight: 600; 
            text-decoration: none; 
            cursor: pointer; 
            transition: 0.3s; 
            border: none;
            font-size: 1rem;
        }

        .btn-print { background: var(--primary); color: white; }
        .btn-print:hover { background: #311b92; transform: translateY(-2px); }

        .btn-back { background: #eee; color: #444; }
        .btn-back:hover { background: #e0e0e0; }

        /* Print optimization */
        @media print {
            body { background: white; padding: 0; }
            .container { box-shadow: none; margin: 0; max-width: 100%; }
            .actions { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Your Career Roadmap</h1>
        <p>Expertly crafted based on your resume analysis and goals</p>
    </div>

    <div id="planContent">
        <div style="text-align: center; padding: 50px;">
            <p>Loading your personalized roadmap...</p>
        </div>
    </div>

    <div class="actions">
        <button onclick="window.print()" class="btn btn-print">Download Roadmap (PDF)</button>
        <a href="createplan.html" class="btn btn-back">Edit Plan Details</a>
    </div>
</div>

<script>
    // 1. Grab the plan data from session storage
    const planData = sessionStorage.getItem("studyPlanData");

    window.onload = function() {
        const contentDiv = document.getElementById('planContent');
        
        if (planData && planData.trim() !== "") {
            // 2. Use Marked.js to convert Markdown string into HTML
            contentDiv.innerHTML = marked.parse(planData);
        } else {
            // Fallback if something went wrong
            contentDiv.innerHTML = `
                <div style="text-align:center; color: #ff5252;">
                    <h3>Oops! Plan not found.</h3>
                    <p>It seems your session has expired or the plan wasn't generated correctly.</p>
                    <a href="createplan.html" style="color: var(--primary)">Go back and try again</a>
                </div>
            `;
        }
    };
</script>

</body>
</html>
