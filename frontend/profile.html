<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #eae5f9;
      color: #2b2c2d;
    }

    /* ---------- NAVBAR ---------- */
  
nav {
  background: linear-gradient(90deg, #5c6bc0, #512da8, #5c6bc0);
  padding: 22px 0;
  margin-top: 10px;
  border-radius: 40px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

/* NAV FLEX CONTAINER */
.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
}

/* USER PROFILE */
.nav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 6px;
}

.user-avatar {
  width: 36px;
  height: 36px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.user-name {
  position: relative;
  padding-bottom: 5px;
}

/* USER NAME UNDERLINE */
.user-name::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 3px;
  background-color: #ffffff;
  transition: width 0.3s ease;
  border-radius: 4px;
}

.nav-user:hover .user-name::after {
  width: 100%;
}

/* NAV LINKS */
nav ul {
  list-style: none;
  display: flex;
  padding: 0;
  margin: 0;
}

nav ul li {
  margin: 0 35px;
  position: relative;
}

nav ul li a {
  text-decoration: none;
  color: white;
  font-weight: 500;
  font-size: 20px;
  position: relative;
  padding-bottom: 5px;
}

nav ul li a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 3px;
  background-color: #ffffff;
  transition: width 0.3s ease;
  border-radius: 4px;
}

nav ul li a:hover::after {
  width: 100%;
}




    /* ---------- PROFILE HEADER ---------- */
    .profile-header {
      text-align: center;
      margin-top: 50px;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #b2a4d9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      margin-top: 15px;
      font-size: 26px;
      font-weight: 600;
    }

    /* ---------- HISTORY SECTION ---------- */
    .history-section {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .history-section h2 {
      margin-bottom: 25px;
      font-size: 24px;
    }

    .history-card {
      background:#eae5f9;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      transition: transform 0.2s ease;
    }

    .history-card:hover {
      transform: translateY(-4px);
    }

    .history-card .row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .history-card span {
      color: #94a3b8;
      font-size: 14px;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
      color: #71629e;
    }
    .profile-name{
      margin-top: 15px;
      font-size: 26px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
<nav>
  <div class="nav-container">
    <a href="profile.html" class="nav-user">
      <div class="user-avatar">👤</div>
      <span id="userName" class="user-name">Guest</span>
    </a>

    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="index2.html" class="active">Analyse</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="index.html" onclick="logoutUser()">Log Out</a></li>
    </ul>
  </div>
</nav>

  <!-- PROFILE HEADER -->
  <div class="profile-header">
    <div class="profile-avatar">👤</div>
    <div class="profile-name" id="profileName">User Name</div>
  </div>

 <div class="history-section">
  <h2>Previous Resume Analysis</h2>
  <div id="historyList"></div>
</div>



<script type="module" src="profile.js"></script>
<script type="module" src="auth.js"></script>



</body>
</html>
