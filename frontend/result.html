<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Analysis Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    nav {
      background: linear-gradient(90deg, #5c6bc0, #512da8, #5c6bc0);
      padding: 22px 0;
      margin-top: 10px;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 6px;
      text-decoration: none;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-name {
      position: relative;
      padding-bottom: 5px;
    }

    nav ul {
      list-style: none;
      display: flex;
      padding: 0;
      margin: 0;
    }

    nav ul li {
      margin: 0 35px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: 500;
      font-size: 20px;
    }

    :root {
      --primary: #6366f1;
      --bg: #eae5f9;
      --card: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      background: var(--bg);
      padding: 20px;
      font-family: system-ui, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #020617;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .score-card {
      background: #eae5f9;
      border-radius: 18px;
      padding: 30px;
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .donut {
      width: 230px;
      height: 230px;
      position: relative;
    }

    .donut svg {
      transform: rotate(-90deg);
    }

    .donut circle {
      fill: none;
      stroke-width: 26;
    }

    .bg {
      stroke: #1e293b;
    }

    .progress {
      stroke: var(--primary);
      stroke-linecap: round;
      transition: stroke-dashoffset 1.4s ease;
    }

    .donut-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: var(--primary);
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    button {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background: var(--primary);
      color: white;
    }

    .error {
      background: #450a0a;
      color: #fecaca;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-container">
    <a href="profile.html" class="nav-user">
      <div class="user-avatar">👤</div>
      <span id="userName" class="user-name">Guest</span>
    </a>

    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="index2.html">Analyse</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="index.html">Log Out</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <h1>Your Career Analysis Results</h1>
  <p class="subtitle">Personalized insights based on your resume</p>

  <div id="content"></div>

  <div class="actions">
    <button onclick="window.location.href='index2.html'">Analyze Another Resume</button>
    <button onclick="downloadPDF()">Download PDF</button>
    <button onclick="createplan()">Create Plan</button>
  </div>
</div>

<!-- ===== FIREBASE + RESULT LOGIC ===== -->
<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  const content = document.getElementById("content");
  const userNameEl = document.getElementById("userName");

  function parseAnalysis(text) {
    const sections = { strengths: [], weaknesses: [], improvement_areas: [], actionable_suggestions: [] };
    let current = null;

    text.split("\n").forEach(line => {
      line = line.trim();
      if (/^strengths/i.test(line)) current = "strengths";
      else if (/^weaknesses/i.test(line)) current = "weaknesses";
      else if (/^improvement/i.test(line)) current = "improvement_areas";
      else if (/^actionable/i.test(line)) current = "actionable_suggestions";
      else if (line.startsWith("-") && current) {
        sections[current].push(line.replace(/^-\s*/, ""));
      }
    });

    return sections;
  }

  function getQueryParam(param) {
    return new URLSearchParams(window.location.search).get(param);
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    // ✅ FIX: SET USER NAME IN NAVBAR
    userNameEl.textContent =
      user.displayName ||
      user.email?.split("@")[0] ||
      "User";

    const docId = getQueryParam("id");
    if (!docId) {
      content.innerHTML = `<div class="error">No analysis selected.</div>`;
      return;
    }

    try {
      const docRef = doc(db, "resumeHistory", user.uid, "analyses", docId);
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) {
        content.innerHTML = `<div class="error">Analysis not found.</div>`;
        return;
      }

      const data = docSnap.data();
      const parsed = parseAnalysis(data.analysis || "");
      const score = Math.min(Math.max(data.score || 0, 0), 100);

      const radius = 105;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (score / 100) * circumference;

      content.innerHTML = `
        <div class="score-card">
          <div class="donut">
            <svg viewBox="0 0 260 260">
              <circle class="bg" cx="130" cy="130" r="${radius}" />
              <circle class="progress" cx="130" cy="130" r="${radius}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${circumference}" />
            </svg>
            <div class="donut-center">${score}%</div>
          </div>
        </div>

        <div class="card"><h2>Strengths</h2><ul>${parsed.strengths.map(i=>`<li>${i}</li>`).join("")}</ul></div>
        <div class="card"><h2>Weaknesses</h2><ul>${parsed.weaknesses.map(i=>`<li>${i}</li>`).join("")}</ul></div>
        <div class="card"><h2>Improvement Areas</h2><ul>${parsed.improvement_areas.map(i=>`<li>${i}</li>`).join("")}</ul></div>
        <div class="card"><h2>Actionable Suggestions</h2><ul>${parsed.actionable_suggestions.map(i=>`<li>${i}</li>`).join("")}</ul></div>
      `;

      requestAnimationFrame(() => {
        document.querySelector(".progress").style.strokeDashoffset = offset;
      });

      localStorage.setItem("analysisResult", JSON.stringify({
        analysis: data.analysis,
        score: score
      }));

    } catch (err) {
      console.error(err);
      content.innerHTML = `<div class="error">Failed to load analysis.</div>`;
    }
  });

  window.createplan = () => {
    const id = getQueryParam("id");
    window.location.href = `createplan.html?id=${id}`;
  };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  function downloadPDF() {
    const raw = localStorage.getItem("analysisResult");
    if (!raw) return;

    const data = JSON.parse(raw);
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 20;

    doc.setFontSize(18);
    doc.text("Resume Analysis Report", 14, y);
    y += 10;

    doc.setFontSize(11);
    data.analysis.split("\n").forEach(line => {
      doc.text(line, 14, y);
      y += 6;
    });

    doc.save("Resume_Analysis_Report.pdf");
  }
</script>

</body>
</html>
