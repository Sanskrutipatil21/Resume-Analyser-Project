<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Results</title>
  <style>
    :root { --primary: #6366f1; --bg: #eae5f9; --card: #0f172a; --text: #e5e7eb; }
    body { margin: 0; background: var(--bg); padding: 20px; font-family: sans-serif; }
    .container { max-width: 900px; margin: auto; }
    .score-card { background: white; border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 30px; }
    .donut { width: 200px; height: 200px; position: relative; margin: auto; }
    .donut svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .progress-circle { stroke: var(--primary); stroke-width: 10; fill: none; stroke-linecap: round; transition: 1s; }
    .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: bold; }
    .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; color: var(--text); }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="header-title" style="text-align:center;">Analyzing...</h1>
    <div id="main-content">
      <div class="score-card">
        <div class="donut">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="40" stroke="#f1f5f9" stroke-width="10" fill="none" />
            <circle id="bar" class="progress-circle" cx="50" cy="50" r="40" stroke-dasharray="251.2" stroke-dashoffset="251.2" />
          </svg>
          <div class="donut-center" id="score-text">0%</div>
        </div>
      </div>
      <div id="sections"></div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    onAuthStateChanged(auth, async (user) => {
      const docId = new URLSearchParams(window.location.search).get("id");
      const snap = await getDoc(doc(db, "resumeHistory", user.uid, "analyses", docId));
      
      if (snap.exists()) {
        const data = snap.data();
        
        // Match Python key: job_role
        document.getElementById("header-title").innerText = `${data.job_role} at ${data.company}`;
        document.getElementById("score-text").innerText = `${data.score}%`;
        
        const circ = 251.2;
        document.getElementById("bar").style.strokeDashoffset = circ - (data.score / 100) * circ;
        
        // Simple list display for analysis
        document.getElementById("sections").innerHTML = `<div class="card"><h2>Analysis</h2><pre>${data.analysis}</pre></div>`;
      }
    });
  </script>
</body>
</html>
