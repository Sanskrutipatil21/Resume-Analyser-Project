<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Analysis Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { --primary: #6366f1; --bg: #eae5f9; --card: #0f172a; --text: #e5e7eb; }
    body { margin: 0; background: var(--bg); padding: 20px; font-family: system-ui, sans-serif; }
    .container { max-width: 900px; margin: auto; }
    .score-card { background: white; border-radius: 20px; padding: 30px; display: flex; justify-content: center; margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .donut { width: 200px; height: 200px; position: relative; }
    .donut svg { transform: rotate(-90deg); width: 200px; height: 200px; }
    .donut circle { fill: none; stroke-width: 20; }
    .bg-circle { stroke: #f1f5f9; }
    .progress-circle { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset 1s ease-out; }
    .donut-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: bold; color: var(--primary); }
    .card { background: var(--card); border-radius: 15px; padding: 25px; margin-bottom: 20px; color: var(--text); }
    h2 { margin-top: 0; color: var(--primary); font-size: 1.25rem; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    ul { padding-left: 20px; }
    li { margin-bottom: 8px; line-height: 1.5; }
    .actions { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
    button { padding: 12px 25px; border-radius: 8px; border: 2px solid var(--primary); background: transparent; color: var(--primary); font-weight: 600; cursor: pointer; }
    button:hover { background: var(--primary); color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="text-align:center;" id="header-title">Career Analysis Results</h1>
    <div id="main-content">
      <p style="text-align:center;">Fetching data...</p>
    </div>
    <div class="actions">
      <button onclick="window.location.href='index2.html'">Analyze Another</button>
      <button onclick="window.print()">Print Report</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    function parseAIString(text) {
      const sections = { strengths: "", weaknesses: "", improvements: "", suggestions: "" };
      const parts = text.split(/(Strengths:|Weaknesses:|Improvement Areas:|Actionable Suggestions:)/i);
      
      for (let i = 0; i < parts.length; i++) {
        const chunk = parts[i].trim();
        if (/Strengths:/i.test(chunk)) sections.strengths = parts[i+1];
        if (/Weaknesses:/i.test(chunk)) sections.weaknesses = parts[i+1];
        if (/Improvement Areas:/i.test(chunk)) sections.improvements = parts[i+1];
        if (/Actionable Suggestions:/i.test(chunk)) sections.suggestions = parts[i+1];
      }
      return sections;
    }

    function formatAsList(str) {
      if (!str) return "<li>No data</li>";
      return str.trim().split('\n')
        .map(line => line.replace(/^[-*•]\s*/, '').trim())
        .filter(line => line.length > 2)
        .map(line => `<li>${line}</li>`).join('');
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "index.html"; return; }
      const docId = new URLSearchParams(window.location.search).get("id");

      try {
        const docRef = doc(db, "resumeHistory", user.uid, "analyses", docId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          
          // KEY FIX: Changed data.role to data.job_role to match main.py
          const jobRole = data.job_role || "Position";
          const company = data.company || "Amazon";
          const score = data.score || 0;
          const rawText = data.analysis || "";
          const parsed = parseAIString(rawText);

          document.getElementById("header-title").innerText = `${jobRole} at ${company}`;

          const radius = 90;
          const circ = 2 * Math.PI * radius;
          const offset = circ - (score / 100) * circ;

          document.getElementById("main-content").innerHTML = `
            <div class="score-card">
              <div class="donut">
                <svg viewBox="0 0 200 200">
                    <circle class="bg-circle" cx="100" cy="100" r="${radius}" />
                    <circle id="bar" class="progress-circle" cx="100" cy="100" r="${radius}" 
                            stroke-dasharray="${circ}" stroke-dashoffset="${circ}" />
                </svg>
                <div class="donut-center">${score}%</div>
              </div>
            </div>
            <div class="card"><h2>Strengths</h2><ul>${formatAsList(parsed.strengths)}</ul></div>
            <div class="card"><h2>Weaknesses</h2><ul>${formatAsList(parsed.weaknesses)}</ul></div>
            <div class="card"><h2>Improvement Areas</h2><ul>${formatAsList(parsed.improvements)}</ul></div>
            <div class="card"><h2>Actionable Suggestions</h2><ul>${formatAsList(parsed.suggestions)}</ul></div>
          `;

          setTimeout(() => { document.getElementById("bar").style.strokeDashoffset = offset; }, 100);
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
