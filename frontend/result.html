<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Analysis Result</title>
<style>
:root { --primary: #6366f1; --bg: #eae5f9; --card: #0f172a; --text: #e5e7eb; }
body { background: var(--bg); font-family: sans-serif; padding: 20px; }
.container { max-width: 800px; margin: auto; }
.score-card { background: white; padding: 30px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
.donut { width: 150px; height: 150px; margin: auto; position: relative; }
.donut svg { transform: rotate(-90deg); width: 100%; height: 100%; }
.bar { fill: none; stroke: var(--primary); stroke-width: 10; stroke-dasharray: 251.2; stroke-dashoffset: 251.2; transition: 1s; }
.card { background: var(--card); color: var(--text); padding: 20px; border-radius: 12px; margin-bottom: 15px; }
h2 { color: var(--primary); margin-top: 0; border-bottom: 1px solid #334; }
</style>
</head>
<body>
<div class="container">
    <h1 id="title" style="text-align:center;">Result</h1>
    <div class="score-card">
        <div class="donut">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke="#eee" stroke-width="10" fill="none"/>
                <circle id="progress" class="bar" cx="50" cy="50" r="40"/>
            </svg>
            <div id="score-text" style="position:absolute; top:40%; left:35%; font-weight:bold; font-size:24px;">0%</div>
        </div>
        <h3 id="subtitle"></h3>
    </div>
    <div id="content"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {
    const id = new URLSearchParams(window.location.search).get("id");
    if (!user || !id) return;

    const snap = await getDoc(doc(db, "resumeHistory", user.uid, "analyses", id));
    if (!snap.exists()) return;

    const data = snap.data();
    const score = data.score || 0;

    document.getElementById("title").innerText = data.job_role || "Analysis";
    document.getElementById("subtitle").innerText = `Company: ${data.company || ""}`;
    document.getElementById("score-text").innerText = `${score}%`;

    const circ = 251.2;
    document.getElementById("progress").style.strokeDashoffset = circ - (score/100)*circ;

    document.getElementById("content").innerHTML = `
        <div class="card">
            <h2>Detailed Analysis</h2>
            <pre style="white-space:pre-wrap;">${data.analysis || ""}</pre>
        </div>
    `;
});
</script>
</body>
</html>
