<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Analysis Result</title>
<style>
:root {
    --primary: #6366f1;
    --bg: #eae5f9;
    --card-bg: #0f172a;
    --card-text: #e5e7eb;
    --card-border: #6366f1;
}
body {
    background: var(--bg);
    font-family: sans-serif;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: auto;
}
.score-card {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    margin-bottom: 20px;
}
.donut {
    width: 150px;
    height: 150px;
    margin: auto;
    position: relative;
}
.donut svg {
    transform: rotate(-90deg);
    width: 100%;
    height: 100%;
}
.bar {
    fill: none;
    stroke: var(--primary);
    stroke-width: 10;
    stroke-dasharray: 251.2;
    stroke-dashoffset: 251.2;
    transition: 1s;
}
.card {
    background: var(--card-bg);
    color: var(--card-text);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    border-left: 5px solid var(--card-border);
}
.card h2 {
    color: var(--primary);
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 18px;
    border-bottom: 1px solid #334;
    padding-bottom: 5px;
}
.card ul {
    margin: 0;
    padding-left: 20px;
}
</style>
</head>
<body>
<div class="container">
    <h1 id="title" style="text-align:center;">Result</h1>
    <div class="score-card">
        <div class="donut">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke="#eee" stroke-width="10" fill="none"/>
                <circle id="progress" class="bar" cx="50" cy="50" r="40"/>
            </svg>
            <div id="score-text" style="position:absolute; top:40%; left:35%; font-weight:bold; font-size:24px;">0%</div>
        </div>
        <h3 id="subtitle"></h3>
    </div>
    <div id="content"></div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

onAuthStateChanged(auth, async (user) => {
    if (!user) return;

    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) return;

    try {
        const snap = await getDoc(doc(db, "resumeHistory", user.uid, "analyses", id));
        if (!snap.exists()) return;

        const data = snap.data();
        console.log("Firestore data:", data); // Debug

        // TITLE & COMPANY
        document.getElementById("title").innerText = data.job_role || "Analysis";
        document.getElementById("subtitle").innerText = `Company: ${data.company || ""}`;

        // SCORE & DONUT
        const score = data.score || 0;
        document.getElementById("score-text").innerText = `${score}%`;
        const circ = 251.2;
        document.getElementById("progress").style.strokeDashoffset = circ - (score / 100) * circ;

        // SPLIT AI ANALYSIS INTO SECTIONS
        const sections = ["Strengths", "Weaknesses", "Improvement Areas", "Actionable Suggestions"];
        let html = "";

        if (data.analysis) {
            sections.forEach(section => {
                const regex = new RegExp(`${section}:\\s*([\\s\\S]*?)(?=(Strengths:|Weaknesses:|Improvement Areas:|Actionable Suggestions:|$))`, "i");
                const match = data.analysis.match(regex);
                if (match && match[1]) {
                    const items = match[1].trim().split(/\n|-/).filter(s => s.trim() !== "");
                    html += `
                        <div class="card">
                            <h2>${section}</h2>
                            <ul>
                                ${items.map(i => `<li>${i.trim()}</li>`).join("")}
                            </ul>
                        </div>
                    `;
                }
            });
        }

        document.getElementById("content").innerHTML = html || `<p>No analysis available.</p>`;
    } catch (e) {
        console.error("[Error] Failed to load analysis:", e);
    }
});
</script>
</body>
</html>
