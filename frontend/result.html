<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Analysis Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
    h1 { text-align: center; color: #333; }
    .section { margin-bottom: 20px; }
    .section h2 { color: #5c6bc0; }
    .section ul { list-style: disc; padding-left: 20px; }
    pre { background: #eef; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Resume Analysis Result</h1>

    <div class="section">
      <h2>Company:</h2>
      <p id="company">-</p>
    </div>

    <div class="section">
      <h2>Job Role:</h2>
      <p id="role">-</p>
    </div>

    <div class="section">
      <h2>Predicted Category:</h2>
      <p id="category">-</p>
    </div>

    <div class="section">
      <h2>Match Score:</h2>
      <p id="score">-</p>
    </div>

    <div class="section">
      <h2>Analysis:</h2>
      <pre id="analysis">-</pre>
    </div>
  </div>

  <script>
    // Fetch result from localStorage or API response
    const resultData = JSON.parse(localStorage.getItem("resumeResult") || "{}");

    document.getElementById("company").textContent = resultData.company || "-";
    document.getElementById("role").textContent = resultData.job_role || "-";
    document.getElementById("category").textContent = resultData.predicted_category || "-";
    document.getElementById("score").textContent = resultData.match_score ? resultData.match_score + "%" : "-";
    document.getElementById("analysis").textContent = resultData.analysis || "-";
  </script>
</body>
</html>
