<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Analysis Result</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- NAVBAR -->
  <nav>
    <a href="index.html">Home</a>
    <a href="profile.html">Profile</a>
  </nav>

  <main>
    <div id="content" class="container">
      <!-- Analysis content injected here -->
    </div>

    <button onclick="downloadPDF()">Download PDF</button>
  </main>

  <!-- LOGIC -->
  <script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  function parseAnalysis(text) {
    const sections = {
      strengths: [],
      weaknesses: [],
      improvement_areas: [],
      actionable_suggestions: []
    };

    let current = null;

    text.split("\n").forEach(line => {
      line = line.trim();

      if (/^strengths/i.test(line)) current = "strengths";
      else if (/^weaknesses/i.test(line)) current = "weaknesses";
      else if (/^improvement/i.test(line)) current = "improvement_areas";
      else if (/^actionable/i.test(line)) current = "actionable_suggestions";
      else if (line.startsWith("-") && current) {
        sections[current].push(line.replace(/^-\s*/, ""));
      }
    });

    return sections;
  }

  const content = document.getElementById("content");
  const params = new URLSearchParams(window.location.search);
  const docId = params.get("id");

  if (!docId) {
    content.innerHTML = `<div class="error">Invalid analysis link.</div>`;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    try {
      const ref = doc(db, "resumeHistory", user.uid, "analyses", docId);
      const snap = await getDoc(ref);

      if (!snap.exists()) {
        content.innerHTML = `<div class="error">Analysis not found.</div>`;
        return;
      }

      const data = snap.data();
      window.currentAnalysis = data; // for PDF

      const parsed = parseAnalysis(data.analysis || "");
      const score = Math.min(Math.max(data.score || 0, 0), 100);

      const radius = 105;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (score / 100) * circumference;

      content.innerHTML = `
        <div class="score-card">
          <div class="donut">
            <svg viewBox="0 0 260 260">
              <circle class="bg" cx="130" cy="130" r="${radius}" />
              <circle class="progress" cx="130" cy="130" r="${radius}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${circumference}" />
            </svg>
            <div class="donut-center">${score}%</div>
          </div>
        </div>

        <div class="card"><h2>Strengths</h2><ul>${parsed.strengths.map(i=>`<li>${i}</li>`).join("")}</ul></div>
        <div class="card"><h2>Weaknesses</h2><ul>${parsed.weaknesses.map(i=>`<li>${i}</li>`).join("")}</ul></div>
        <div class="card"><h2>Improvement Areas</h2><ul>${parsed.improvement_areas.map(i=>`<li>${i}</li>`).join("")}</ul></div>
        <div class="card"><h2>Actionable Suggestions</h2><ul>${parsed.actionable_suggestions.map(i=>`<li>${i}</li>`).join("")}</ul></div>
      `;

      // Animate donut
      requestAnimationFrame(() => {
        document.querySelector(".progress").style.strokeDashoffset = offset;
      });

    } catch (err) {
      console.error(err);
      content.innerHTML = `<div class="error">Failed to load analysis.</div>`;
    }
  });
  </script>

  <!-- PDF DOWNLOAD -->
  <script>
  function downloadPDF() {
    if (!window.currentAnalysis) return;

    const data = window.currentAnalysis;
    const parsed = (function(text){
      const sections = { strengths: [], weaknesses: [], improvement_areas: [], actionable_suggestions: [] };
      let current = null;
      text.split("\n").forEach(line=>{
        line=line.trim();
        if(/^strengths/i.test(line)) current="strengths";
        else if(/^weaknesses/i.test(line)) current="weaknesses";
        else if(/^improvement/i.test(line)) current="improvement_areas";
        else if(/^actionable/i.test(line)) current="actionable_suggestions";
        else if(line.startsWith("-") && current) sections[current].push(line.replace(/^-\s*/,""));
      });
      return sections;
    })(data.analysis || "");

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let y = 15;

    doc.setFontSize(18);
    doc.text("Resume Analysis Report", 14, y);
    y += 10;

    const add = (title, items) => {
      doc.setFontSize(14);
      doc.text(title, 14, y);
      y += 6;
      doc.setFontSize(11);
      items.forEach(i => {
        const lines = doc.splitTextToSize("- " + i, 180);
        doc.text(lines, 18, y);
        y += lines.length * 6;
      });
      y += 4;
    };

    add("Strengths", parsed.strengths);
    add("Weaknesses", parsed.weaknesses);
    add("Improvement Areas", parsed.improvement_areas);
    add("Actionable Suggestions", parsed.actionable_suggestions);

    doc.save("Resume_Analysis_Report.pdf");
  }
  </script>

</body>
</html>
