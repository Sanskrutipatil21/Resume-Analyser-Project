<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Study Plan Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(135deg,#eef0ff,#f7f8ff);color:#222}
nav{background:linear-gradient(90deg,#5c6bc0,#512da8,#5c6bc0);padding:22px 0;margin-top:10px;border-radius:40px;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.nav-container{display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.nav-user{display:flex;align-items:center;gap:10px;color:white;text-decoration:none}
.user-avatar{width:36px;height:36px;background:rgba(255,255,255,.25);border-radius:50%;display:flex;align-items:center;justify-content:center}
nav ul{list-style:none;display:flex;margin:0;padding:0}
nav ul li{margin:0 35px}
nav ul li a{color:white;text-decoration:none;font-size:20px}

.wrapper{max-width:900px;margin:60px auto;padding:0 20px}
.card{background:rgba(255,255,255,.6);backdrop-filter:blur(18px);border-radius:28px;padding:45px;box-shadow:0 25px 50px rgba(0,0,0,.12)}
.progress-bar{height:10px;background:#ddd;border-radius:99px;margin-bottom:30px;overflow:hidden}
.progress{height:100%;width:20%;background:linear-gradient(90deg,#5c6bc0,#512da8);transition:.4s}
.step{display:none}
.step.active{display:block}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.option{padding:16px;text-align:center;border-radius:16px;background:white;cursor:pointer;border:1px solid #ccc}
.option.active{background:linear-gradient(135deg,#5c6bc0,#512da8);color:white}
.actions{display:flex;justify-content:space-between;margin-top:30px}
button{padding:14px 30px;border-radius:16px;border:none;cursor:pointer;font-weight:600}
.next{background:linear-gradient(135deg,#5c6bc0,#512da8);color:white}
.back{background:transparent;border:1px solid #aaa}
</style>
</head>

<body>

<nav>
  <div class="nav-container">
    <a href="profile.html" class="nav-user">
      <div class="user-avatar">👤</div>
      <span id="userName">Guest</span>
    </a>
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="index2.html">Analyse</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="index.html">Log Out</a></li>
    </ul>
  </div>
</nav>

<div class="wrapper">
  <div class="card">

    <div class="progress-bar"><div class="progress" id="progress"></div></div>

    <!-- STEP 1 -->
    <div class="step active">
      <h2>Career Goal</h2>
      <input id="targetRole" placeholder="Target Role" />
      <input id="targetCompany" placeholder="Target Company" style="margin-top:15px"/>
      <div class="actions">
        <span></span>
        <button class="next">Next</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="step">
      <h2>Timeline</h2>
      <div class="options" id="timeline">
        <div class="option">3 Months</div>
        <div class="option">6 Months</div>
        <div class="option">1 Year</div>
      </div>
      <div class="actions">
        <button class="back">Back</button>
        <button class="next">Next</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="step">
      <h2>Skills to Improve</h2>
      <textarea id="skills" style="width:100%;height:100px"></textarea>
      <div class="actions">
        <button class="back">Back</button>
        <button class="next">Create Plan</button>
      </div>
    </div>

  </div>
</div>

<script>
/* ===================== HARD BLOCK ===================== */
const params = new URLSearchParams(window.location.search);
const docId = params.get("id");

if (!docId) {
  alert("Analyze resume first.");
  window.location.href = "index2.html";
}

/* ===================== LOAD AI ANALYSIS ===================== */
let resumeAnalysis = "";

fetch(`http://localhost:8000/resume-analysis?id=${docId}`)
  .then(res => res.json())
  .then(data => {
    resumeAnalysis = data.analysis;
    if (!resumeAnalysis) throw new Error();
  })
  .catch(() => {
    alert("Resume analysis missing.");
    window.location.href = "index2.html";
  });

/* ===================== STEPS ===================== */
const steps = document.querySelectorAll(".step");
const progress = document.getElementById("progress");
let current = 0;

function update(){
  steps.forEach(s=>s.classList.remove("active"));
  steps[current].classList.add("active");
  progress.style.width=((current+1)/steps.length*100)+"%";
}

document.querySelectorAll(".next").forEach(btn=>{
  btn.onclick=async()=>{
    if(current===steps.length-1){
      await createPlan();
    }else{
      current++;update();
    }
  }
});

document.querySelectorAll(".back").forEach(btn=>{
  btn.onclick=()=>{current--;update()}
});

document.querySelectorAll(".option").forEach(o=>{
  o.onclick=()=>{
    o.parentElement.querySelectorAll(".option").forEach(x=>x.classList.remove("active"));
    o.classList.add("active");
  }
});

/* ===================== SEND TO AI ===================== */
async function createPlan(){
  const payload = {
    resumeAnalysis,
    targetRole: targetRole.value,
    targetCompany: targetCompany.value,
    timeline: document.querySelector("#timeline .option.active")?.textContent,
    skillsToImprove: skills.value
  };

  const res = await fetch("http://localhost:8000/study-plan",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });

  const data = await res.json();
  if(data.study_plan){
    sessionStorage.setItem("studyPlanData",data.study_plan);
    window.location.href="study-plan-result.html";
  }else{
    alert("AI failed to generate plan");
  }
}
</script>

<script type="module" src="auth.js"></script>
<script type="module" src="profile.js"></script>

</body>
</html>
