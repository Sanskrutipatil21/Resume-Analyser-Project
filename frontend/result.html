<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Analysis Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    nav {
      background: linear-gradient(90deg, #5c6bc0, #512da8, #5c6bc0);
      padding: 22px 0;
      margin-top: 10px;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
    }

    .nav-user {
      display: flex;
      align-items: center;
      gap: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-name {
      position: relative;
      padding-bottom: 5px;
    }

    nav ul {
      list-style: none;
      display: flex;
      margin: 0;
      padding: 0;
    }

    nav ul li {
      margin: 0 30px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    :root {
      --primary: #6366f1;
      --bg: #eae5f9;
      --card: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    body {
      margin: 0;
      background: var(--bg);
      padding: 20px;
      font-family: system-ui, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #020617;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .score-card {
      background: #eae5f9;
      border-radius: 18px;
      padding: 30px;
      display: flex;
      justify-content: center;
      margin-bottom: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .donut {
      width: 230px;
      height: 230px;
      position: relative;
    }

    .donut svg {
      transform: rotate(-90deg);
    }

    .donut circle {
      fill: none;
      stroke-width: 26;
    }

    .bg {
      stroke: #1e293b;
    }

    .progress {
      stroke: var(--primary);
      stroke-linecap: round;
      transition: stroke-dashoffset 1.4s ease;
    }

    .donut-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: var(--primary);
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      color: var(--text);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    button {
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--primary);
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary);
      color: white;
    }

    .error {
      background: #450a0a;
      color: #fecaca;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-container">
    <a href="profile.html" class="nav-user">
      <div class="user-avatar">👤</div>
      <span id="userName" class="user-name">Guest</span>
    </a>

    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="index2.html">Analyse</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="index.html">Log Out</a></li>
    </ul>
  </div>
</nav>

<div class="container">
  <h1>Your Career Analysis Results</h1>
  <p class="subtitle">Personalized insights based on your resume</p>
  <div id="content"></div>

  <div class="actions">
    <button onclick="window.location.href='index2.html'">Analyze Another Resume</button>
    <button onclick="createplan()">Create Plan</button>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  const content = document.getElementById("content");
  const userNameEl = document.getElementById("userName");

  function parseAnalysis(text) {
    const sections = { strengths: [], weaknesses: [], improvement_areas: [], actionable_suggestions: [] };
    let current = null;

    text.split("\n").forEach(line => {
      line = line.trim();
      if (/^strengths/i.test(line)) current = "strengths";
      else if (/^weaknesses/i.test(line)) current = "weaknesses";
      else if (/^improvement/i.test(line)) current = "improvement_areas";
      else if (/^actionable/i.test(line)) current = "actionable_suggestions";
      else if (line.startsWith("-") && current) {
        sections[current].push(line.replace("- ", ""));
      }
    });

    return sections;
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }

    // ✅ FIX: USER NAME
    if (user.displayName) {
      userNameEl.textContent = user.displayName;
    } else {
      const userRef = doc(db, "users", user.uid);
      const snap = await getDoc(userRef);
      userNameEl.textContent = snap.exists() ? snap.data().name : "User";
    }

    const docId = new URLSearchParams(window.location.search).get("id");
    if (!docId) {
      content.innerHTML = `<div class="error">No analysis selected.</div>`;
      return;
    }

    const analysisRef = doc(db, "resumeHistory", user.uid, "analyses", docId);
    const analysisSnap = await getDoc(analysisRef);

    if (!analysisSnap.exists()) {
      content.innerHTML = `<div class="error">Analysis not found.</div>`;
      return;
    }

    const data = analysisSnap.data();
    const parsed = parseAnalysis(data.analysis || "");
    const score = data.score || 0;

    const r = 105;
    const c = 2 * Math.PI * r;
    const offset = c - (score / 100) * c;

    content.innerHTML = `
      <div class="score-card">
        <div class="donut">
          <svg viewBox="0 0 260 260">
            <circle class="bg" cx="130" cy="130" r="${r}" />
            <circle class="progress" cx="130" cy="130" r="${r}"
              stroke-dasharray="${c}"
              stroke-dashoffset="${offset}" />
          </svg>
          <div class="donut-center">${score}%</div>
        </div>
      </div>

      <div class="card"><h2>Strengths</h2><ul>${parsed.strengths.map(i=>`<li>${i}</li>`).join("") || "<li>No data</li>"}</ul></div>
      <div class="card"><h2>Weaknesses</h2><ul>${parsed.weaknesses.map(i=>`<li>${i}</li>`).join("") || "<li>No data</li>"}</ul></div>
      <div class="card"><h2>Improvement Areas</h2><ul>${parsed.improvement_areas.map(i=>`<li>${i}</li>`).join("") || "<li>No data</li>"}</ul></div>
      <div class="card"><h2>Actionable Suggestions</h2><ul>${parsed.actionable_suggestions.map(i=>`<li>${i}</li>`).join("") || "<li>No data</li>"}</ul></div>
    `;
  });

  function createplan() {
    const id = new URLSearchParams(window.location.search).get("id");
    window.location.href = `createplan.html?id=${id}`;
  }
</script>

</body>
</html>
