<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Analysis Result</title>
  <style>
    :root { --primary: #6366f1; --bg: #eae5f9; --card: #0f172a; --text: #e5e7eb; }
    body { margin: 0; background: var(--bg); font-family: sans-serif; padding: 20px; color: #1e293b; }
    .container { max-width: 800px; margin: auto; }
    .score-card { background: white; border-radius: 20px; padding: 30px; text-align: center; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .donut { width: 150px; height: 150px; margin: auto; position: relative; }
    .donut svg { transform: rotate(-90deg); width: 100%; height: 100%; }
    .progress { fill: none; stroke: var(--primary); stroke-width: 10; stroke-linecap: round; transition: 1s; }
    .donut-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-weight: bold; }
    .card { background: var(--card); border-radius: 12px; padding: 20px; margin-bottom: 15px; color: var(--text); }
    h2 { color: var(--primary); border-bottom: 1px solid #334; padding-bottom: 8px; font-size: 1.1rem; }
    ul { padding-left: 18px; line-height: 1.6; }
    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
    button { padding: 10px 20px; border-radius: 6px; border: 2px solid var(--primary); background: transparent; color: var(--primary); cursor: pointer; font-weight: bold; }
    button:hover { background: var(--primary); color: white; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title" style="text-align:center">Result</h1>
    <div class="score-card">
      <div class="donut">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" stroke="#eee" stroke-width="10" fill="none" />
          <circle id="bar" class="progress" cx="50" cy="50" r="40" stroke-dasharray="251.2" stroke-dashoffset="251.2" />
        </svg>
        <div id="score-val" class="donut-text">0%</div>
      </div>
      <h3 id="subtitle"></h3>
    </div>
    <div id="results-box"></div>
    <div class="actions">
      <button onclick="window.location.href='index2.html'">New Analysis</button>
      <button onclick="window.print()">Print</button>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

    function parseText(text) {
      const parts = { s: "", w: "", i: "", a: "" };
      const regex = /(Strengths:|Weaknesses:|Improvement Areas:|Actionable Suggestions:)/i;
      const chunks = text.split(regex);
      for(let i=1; i<chunks.length; i+=2) {
        const key = chunks[i].toLowerCase();
        if(key.includes("strengths")) parts.s = chunks[i+1];
        else if(key.includes("weaknesses")) parts.w = chunks[i+1];
        else if(key.includes("improvement")) parts.i = chunks[i+1];
        else if(key.includes("suggestions")) parts.a = chunks[i+1];
      }
      return parts;
    }

    function toList(str) {
      return str.trim().split('\n').filter(l => l.length > 2).map(l => `<li>${l.replace(/^[-*•]\s*/, '')}</li>`).join('');
    }

    onAuthStateChanged(auth, async (user) => {
      const id = new URLSearchParams(window.location.search).get("id");
      const snap = await getDoc(doc(db, "resumeHistory", user.uid, "analyses", id));
      if (snap.exists()) {
        const data = snap.data();
        const p = parseText(data.analysis || "");
        
        document.getElementById("title").innerText = data.job_role;
        document.getElementById("subtitle").innerText = `Target: ${data.company}`;
        document.getElementById("score-val").innerText = `${data.score}%`;
        
        const circ = 251.2;
        document.getElementById("bar").style.strokeDashoffset = circ - (data.score/100)*circ;
        
        document.getElementById("results-box").innerHTML = `
          <div class="card"><h2>Strengths</h2><ul>${toList(p.s)}</ul></div>
          <div class="card"><h2>Weaknesses</h2><ul>${toList(p.w)}</ul></div>
          <div class="card"><h2>Improvement Areas</h2><ul>${toList(p.i)}</ul></div>
          <div class="card"><h2>Actionable Suggestions</h2><ul>${toList(p.a)}</ul></div>
        `;
      }
    });
  </script>
</body>
</html>
