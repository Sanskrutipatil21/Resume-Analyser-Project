<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

   body {
  margin: 0;
  min-height: 100vh;
  background:#dfdef5;
  font-family: 'Inter', sans-serif;
}

 .contact-wrapper {
  background: #aaa2dd;
  width: 90%;
  max-width: 10000px;
  padding: 60px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.08);
  border-radius: 4px;
  margin: 40px auto;   /* ✅ centers horizontally */
  margin-top: 100px;
}

    .contact-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
    }

    /* LEFT CONTENT */
    .contact-info h1 {
      font-family: 'Playfair Display', serif;
      font-size: 47px;
      font-weight: 630;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .contact-info p.subtitle {
      font-size: 17px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .contact-info p.description {
      font-size: 18px;
      line-height: 2.4;
      color: #ffffff;
      max-width: 320px;
    }

    .contact-email {
      margin-top: 30px;
      font-size: 14px;
      color: #000000;
    }

    /* FORM */
    form label {
      display: block;
      font-size: 12px;
      margin-bottom: 6px;
      color: #ffffff;
    }

form input,
form textarea {
  width: 100%;
  padding: 10px;
  font-size: 13px;       /* Normal font size */
  border: 1px solid #ffffff;
  outline: none;
  background: #aaa2dd;   /* Light background so text is visible */
  color: #ffffff;         /* Dark text color */
  border-radius: 4px;
}

form textarea {
  resize: none;
  height: 90px;
}


    .row {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
    }

    .field {
      flex: 1;
    }

    .full {
      margin-bottom: 16px;
    }

    .submit-btn {
      margin-top: 10px;
      padding: 10px 22px;
      background: #887fb7;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.3s ease;
    }

    .submit-btn:hover {
      background: #9a95fa;
    }

    /* RESPONSIVE */
    @media (max-width: 800px) {
      .contact-container {
        grid-template-columns: 1fr;
      }

      .contact-wrapper {
        padding: 40px 30px;
      }
    }

    
    .nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
}
.nav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-size: 16px;
  cursor: pointer;
  margin-top: 6px; /* 👈 makes it slightly lower */
}

.user-avatar {
  width: 36px;
  height: 36px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.user-name {
  white-space: nowrap;
}

    nav {
  background: linear-gradient(90deg, #5c6bc0, #512da8, #5c6bc0);
  padding: 22px 0;
  margin-top: 10px;
  border-radius: 40px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  
}

/* Align nav items horizontally to the right */
nav ul {
  list-style: none;
  display: flex;
  
  margin: 0;
  padding: 0 40px;
}

/* Space between items */
nav ul li {
  margin: 0 35px;
  position: relative; /* Important for underline positioning */
}

/* Style for links */
nav ul li a {
  text-decoration: none;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 20px;
  transition: color 0.3s ease;
  position: relative; /* isolate hover underline */
  padding-bottom: 5px;
}

/* Hover text color */
nav ul li a:hover {
  color: #fefbfb; /* gold color on hover */
}

/* === Underline animation (appears only under hovered item) === */
nav ul li a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 3px;
  background-color: #ffffff;
  transition: width 0.3s ease;
  border-radius: 4px;
}

/* When hovered, underline expands */
nav ul li a:hover::after {
  width: 100%;
}

/* === Underline for user name (same as nav links) === */
.user-name {
  position: relative;
  padding-bottom: 5px;
}

/* Underline hidden by default */
.user-name::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 3px;
  background-color: #ffffff;
  transition: width 0.3s ease;
  border-radius: 4px;
}

/* Show underline on hover */
.nav-user:hover .user-name::after {
  width: 100%;
}


  </style>
</head>

<body>

  
<nav>
    <div class="nav-container">

    <!-- User Profile (LEFT) -->
   <a href="profile.html" class="nav-user">
  <div class="user-avatar">👤</div>
  <span id="userName" class="user-name">Guest</span>
</a>

  <ul>
    
    <li><a href="home.html">Home</a></li>
    <li><a href="index2.html" class="active">Analyse</a></li>
    <li><a href="contact.html">Contact Us</a></li>
    <li><a href="index.html">Log Out</a></li>
  </ul>
</nav>

  <div class="contact-wrapper">
    <div class="contact-container">

      <!-- LEFT -->
      <div class="contact-info">
        <h1>Get in Touch</h1>
        <p class="subtitle">I'd love to hear from you!</p>
        <p class="description">
          If you have any inquiries or just want to say hi,
          please use the contact form.
        </p>

        <div class="contact-email">
          ✉ sanskrutipatil212006@gmail.com
        </div>
      </div>

      <!-- RIGHT FORM -->
      <form id="contactForm">
        <div class="row">
          <div class="field">
            <label>First Name</label>
            <input type="text" id="firstName" required />
          </div>
          <div class="field">
            <label>Last Name</label>
            <input type="text" id="lastName" required />
          </div>
        </div>

        <div class="full">
          <label>Email *</label>
          <input type="email" id="email" required />
        </div>

        <div class="full">
          <label>Message</label>
          <textarea id="message" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send</button>
      </form>

    </div>
  </div>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

  <script>
    (function () {
      emailjs.init("H92pTuVDdDXMbYYjp"); // 🔑 replace this
    })();

    document.getElementById("contactForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const firstName = document.getElementById("firstName").value;
      const lastName = document.getElementById("lastName").value;

      emailjs.send("service_zv1kert", "template_rji4yub", {
        name: firstName + " " + lastName,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value
      })
      .then(() => {
        alert("Message sent successfully!");
        document.getElementById("contactForm").reset();
      })
      .catch((error) => {
        console.error(error);
        alert("Failed to send message");
      });
    });
  </script>
<script type="module" src="auth.js"></script>

</body>
</html>
