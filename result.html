<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Resume Analysis Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    .nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
}
.nav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-size: 16px;
  cursor: pointer;
  margin-top: 6px; /* 👈 makes it slightly lower */
}

.user-avatar {
  width: 36px;
  height: 36px;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.user-name {
  white-space: nowrap;
}

    nav {
  background: linear-gradient(90deg, #5c6bc0, #512da8, #5c6bc0);
  padding: 22px 0;
  margin-top: 10px;
  border-radius: 40px;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  
}

/* Align nav items horizontally to the right */
nav ul {
  list-style: none;
  display: flex;
  
  margin: 0;
  padding: 0 40px;
}

/* Space between items */
nav ul li {
  margin: 0 35px;
  position: relative; /* Important for underline positioning */
}

/* Style for links */
nav ul li a {
  text-decoration: none;
  color: white;
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  font-size: 20px;
  transition: color 0.3s ease;
  position: relative; /* isolate hover underline */
  padding-bottom: 5px;
}

/* Hover text color */
nav ul li a:hover {
  color: #fefbfb; /* gold color on hover */
}

/* === Underline animation (appears only under hovered item) === */
nav ul li a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 3px;
  background-color: #ffffff;
  transition: width 0.3s ease;
  border-radius: 4px;
}

/* When hovered, underline expands */
nav ul li a:hover::after {
  width: 100%;
}

/* === Underline for user name (same as nav links) === */
.user-name {
  position: relative;
  padding-bottom: 5px;
}

/* Underline hidden by default */
.user-name::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0%;
  height: 3px;
  background-color: #ffffff;
  transition: width 0.3s ease;
  border-radius: 4px;
}

/* Show underline on hover */
.nav-user:hover .user-name::after {
  width: 100%;
}


    :root {
      --primary: #6366f1;
      --success:#6366f1;;
      --danger: #ef4444;
      --bg: #020617;
      --card: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }


    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      background:#eae5f9;
      color: var(--text);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #020617;
      font-size: 4vw;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
      font-size: 1.4vw;
    }

    /* ===== Donut Section ===== */
    .score-card {
      
      background: #eae5f9;
      border-radius: 18px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      margin-bottom: 25px;
    }

   .donut {
  width: 230px;   /* increased size */
  height: 230px;  /* increased size */
  position: relative;
}

    .donut svg {
      transform: rotate(-90deg);
    }

    .donut circle {
  fill: none;
  stroke-width: 26; /* thicker & bigger */
}


    .donut .bg {
      stroke: #1e293b;
    }
.donut .progress {
  stroke: var(--success);
  stroke-linecap: round;
  transition: stroke-dashoffset 1.4s ease-in-out;
}

.donut-center {
   
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;
  z-index: 2;
}

.donut-center .score {
 
  font-size: clamp(24px, 5vw, 36px); /* responsive font size */
  font-weight: bold;
  line-height: 1;
  margin: 0; /* IMPORTANT */
  color: #6366f1;
}


    .label {
      margin-top: 12px;
      font-size: 15px;
      color: var(--muted);
    }

    .job-info {
      margin-top: 20px;
      text-align: center;
    }

    .company {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--primary);
      color: var(--primary);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .role {
      font-size: 20px;
      font-weight: 600;
    }

    /* ===== Sections ===== */
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    .success li { color:#6366f1; }
    .danger li { color: #fecaca; }
    .info li { color: #bfdbfe; }

    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    button {
      background: transparent;
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    button:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px) scale(1.03);
    }

    .error {
      background: #450a0a;
      border: 1px solid var(--danger);
      padding: 15px;
      border-radius: 10px;
      color: #fecaca;
      text-align: center;
    }

    @media (max-width: 600px) {
      .donut {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>
<body>

<nav>
    <div class="nav-container">

    <!-- User Profile (LEFT) -->
   <a href="profile.html" class="nav-user">
  <div class="user-avatar">👤</div>
  <span id="userName" class="user-name">Guest</span>
</a>

  <ul>
    
    <li><a href="home.html">Home</a></li>
    <li><a href="index2.html" class="active">Analyse</a></li>
    <li><a href="contact.html">Contact Us</a></li>
    <li><a href="index.html">Log Out</a></li>
  </ul>
</nav>
<div class="container">
<h1>Your Career Analysis Results</h1>
<p class="subtitle">Personalized insights based on your resume</p>


  <div id="content"></div>

  <div class="actions">
    <button onclick="goBack()">Analyze Another Resume</button>
    <button onclick="clearResult()">Clear Result</button>
  </div>

</div>

<script>
  const content = document.getElementById("content");
  const rawData = localStorage.getItem("analysisResult");

  if (!rawData) {
    content.innerHTML = `
      <div class="error">
        No analysis data found. Please analyze a resume first.
      </div>
    `;
  } else {
    const data = JSON.parse(rawData);

    if (data.error) {
      content.innerHTML = `<div class="error">${data.error}</div>`;
    } else {
      const score = Math.min(Math.max(data.match_score, 0), 100);
const radius = 105; // bigger donut
const circumference = 2 * Math.PI * radius;
const offset = circumference - (score / 100) * circumference;


      content.innerHTML = `
        <!-- Donut Score -->
        <div class="score-card">
          <div class="donut">
            
<svg viewBox="0 0 260 260" width="100%" height="100%">
  <circle class="bg" cx="130" cy="130" r="${radius}" />
 
  <circle
  class="progress"
  cx="130"
  cy="130"
  r="${radius}"
  stroke-dasharray="${circumference}"
  stroke-dashoffset="${circumference}"
/>

</svg>


            <div class="donut-center">
              <div class="score">${score}%</div>
              
            </div>
          </div>

         
        </div>

        <div class="card success">
          <h2>Strengths</h2>
          <ul>
            ${data.strengths.length ? data.strengths.map(i => `<li>${i}</li>`).join("") : "<li>No major strengths detected</li>"}
          </ul>
        </div>

        <div class="card danger">
          <h2>Weaknesses</h2>
          <ul>
            ${data.weaknesses.length ? data.weaknesses.map(i => `<li>${i}</li>`).join("") : "<li>No critical weaknesses detected</li>"}
          </ul>
        </div>

        <div class="card info">
          <h2>Improvement Areas</h2>
          <ul>
            ${data.improvement_areas.length ? data.improvement_areas.map(i => `<li>${i}</li>`).join("") : "<li>No major improvements needed</li>"}
          </ul>
        </div>

        <div class="card info">
          <h2>Actionable Suggestions</h2>
          <ul>
            ${data.actionable_suggestions.length ? data.actionable_suggestions.map(i => `<li>${i}</li>`).join("") : "<li>No additional suggestions</li>"}
          </ul>
        </div>
      `;
      // 🔄 Animate donut after it is rendered
requestAnimationFrame(() => {
  const progressCircle = document.querySelector(".donut .progress");
  if (progressCircle) {
    progressCircle.style.strokeDashoffset = offset;
  }
});

    }
  }

  function goBack() {
    window.location.href = "index2.html";
  }

  function clearResult() {
    localStorage.removeItem("analysisResult");
    location.reload();
  }
</script>
<script type="module" src="auth.js"></script>

</body>
</html>
